name: Create sdist & upload to PyPi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # The dashboard ships as static files inside the package (theonionbox/web).
    - name: Build the dashboard
      run: |
        npm ci
        npm run build
      working-directory: frontend

    - name: Pip grip (dependency of setup.py)
      run: python -m pip install --upgrade pip setuptools wheel grip

    - name: Run setup.py to create sdist
      run: python setup.py sdist

    - name: Publish TheOnionBox distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.pypi_theonionbox }}
