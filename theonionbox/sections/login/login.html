%# Note that this file is not a valid *.html file!
%# It is intended to be a bottlepy - style template
%# used for the scripting part of TheOnionBox!

<div class="auth-card" id="login_form">
    <h1>Sign in</h1>
    <p>Enter the control password of your Tor node.</p>

    <form role="login" onsubmit="return do_login();">
        <label class="field" for="login_pwd">Password</label>
        <input type="password" class="input" id="login_pwd" name="login_pwd" tabindex="1"
               autocomplete="current-password" autofocus>

        <button type="submit" id="button_login" class="btn">
            <span>Login</span>
            <span class="spnnr" style="display: none;">
                <span class="sk-three-bounce"><span class="sk-child sk-bounce1"></span><span class="sk-child sk-bounce2"></span><span class="sk-child sk-bounce3"></span></span>
            </span>
        </button>
    </form>

</div>

<div id="info_expired" class="auth-card" style="display: none; margin-top: 16px;">
    <div class="alert" style="margin: 0;">Session expired. Please reload this page.</div>
</div>
